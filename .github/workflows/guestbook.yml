name: Guestbook

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-readme-writes
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'approved' && startsWith(github.event.issue.title, '[Guestbook]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish approved entry
        run: python3 scripts/guestbook.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/guestbook.json assets/guestbook.svg
          git diff --cached --quiet || (git commit -m "chore: update guestbook" && git pull --rebase && git push)
